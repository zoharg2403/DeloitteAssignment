pipelines:

  users_per_city:

    dag:
      dag_id:          "users-per-city"
      schedule:        null  # "@monthly"
      start_date:      "01-01-2026"
      catchup:         false
      max_active_runs: 1
      default_args:
        retries:                   0
        retry_delay:               120   # 2 minutes[sec]
        # retry_exponential_backoff: true  # 
        # max_retry_delay:           900   # 15 minutes [sec]

    tasks:
      - task_id:    compile_dataform
        is_enabled: true
        operator:   DataformCreateCompilationResultOperator

      - task_id:    dataform_transformations
        is_enabled: true
        operator:   DataformCreateWorkflowInvocationOperator
        depends_on: [compile_dataform]
        params:
          workflow_invocation:
            invocation_config:
              included_targets:
                - schema: gold
                  name:   users_address
              transitive_dependencies_included: true
      
