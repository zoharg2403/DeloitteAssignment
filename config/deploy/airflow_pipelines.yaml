airflow_deploy:
  
  assets:
    dags_files:
    # upload as files in "dags" folder (wo relative path)
      - airflow_pipelines/dags/
      - .env
    dags_subdirs:
    # upload as subdirectories in "dags" folder (w relative path)
      - common/
      - airflow_pipelines/utils/
      - airflow_pipelines/__init__.py
      - config/airflow_pipelines/pipelines.yaml
      - config/dataproc/jobs.yaml
      - config/environments.yaml
      - config/common.yaml
  
  ignore_patterns:
    dirs:
      - __pycache__
    extensions:
      - .pyc
      - .zip
